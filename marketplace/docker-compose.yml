# Despliegue en Coolify (Docker Compose). Variables en el panel de Coolify; nunca en el repositorio.
services:
  marketplace:
    build:
      context: ..
      dockerfile: marketplace/server/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Define ADMIN_TOKEN (32+ caracteres)}
      PUBLISHER_PUBLIC_KEY: ${PUBLISHER_PUBLIC_KEY:?Define PUBLISHER_PUBLIC_KEY (clave pública de lsplugin keygen)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Define PUBLIC_BASE_URL (https://...)}
      MAX_PACKAGE_MB: ${MAX_PACKAGE_MB:-100}
    volumes:
      - marketplace-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "dotnet", "LiveStream.Marketplace.Server.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  marketplace-data:
